<!doctype html>
<html lang="{{LANG}}" dir="{{DIR}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
{{FEED_LINK}}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Hebrew:wght@600;700;800&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap">
<style>
/* One-page broadsheet: masthead, two auto-flowing columns, analysis band, corrections, archive nav. */
:root{
  --paper:#F2EFE6; --ink:#1A1814; --muted:#5A554C; --rule:#1A1814; --hair:#C9C3B4;
  --display:'Noto Serif Hebrew','Frank Ruhl Libre',Georgia,serif;
  --body:'IBM Plex Sans Hebrew','Assistant','Arial Hebrew',Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{--paper:#1B1A17;--ink:#E9E4D8;--muted:#A9A293;--rule:#E9E4D8;--hair:#4A463E;color-scheme:dark}}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);-webkit-text-size-adjust:100%}
.page{max-width:1120px;margin:0 auto;padding-block:40px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:30px}
.page.narrow{max-width:680px}
a{color:var(--ink)} a:hover{color:var(--muted)} a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

.dateline{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 24px;font-size:15px;font-weight:500;padding-bottom:10px;border-bottom:3px solid var(--rule)}
.mast{margin:0;padding:16px 0 8px;font-family:var(--display);font-weight:800;font-size:clamp(68px,11vw,136px);line-height:1.05;text-align:center}
.mast a{text-decoration:none}
.mast.small{font-size:clamp(44px,7vw,64px);padding:12px 0 6px}
.double{height:4px;border-top:1px solid var(--rule);border-bottom:3px solid var(--rule)}
.tag{margin:0;padding:10px 0;text-align:center;font-size:16px;border-bottom:1px solid var(--rule)}

.cols{column-width:330px;column-count:2;column-gap:56px;column-rule:1px solid var(--rule)}
section.desk{break-inside:avoid-column;margin-bottom:28px}
.label{margin:0 0 14px;padding-bottom:4px;border-bottom:1px solid var(--rule);font-family:var(--body);font-size:15px;font-weight:700;letter-spacing:.02em}
article{break-inside:avoid;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--hair)}
article:last-child{border-bottom:0;padding-bottom:0;margin-bottom:0}
h3{margin:0 0 8px;font-family:var(--display);font-size:21px;font-weight:700;line-height:1.35;text-wrap:balance}
p{margin:0;font-size:17px;line-height:1.75}
article p+p{margin-top:8px}
.src{margin-top:7px;font-size:14px;color:var(--muted)}

.analysis{border-top:3px solid var(--rule);border-bottom:1px solid var(--rule);padding-block:20px 24px;column-width:330px;column-count:2;column-gap:56px;column-rule:1px solid var(--rule)}
.analysis .head{column-span:all;margin-bottom:16px}
.analysis .head .label{border:0;padding:0;margin:0 0 6px}
.analysis .head h3{font-size:clamp(24px,3.2vw,30px);line-height:1.25;margin:0}
.analysis .by{margin-top:6px;font-size:15px;color:var(--muted)}
.analysis p{margin-bottom:12px}
.analysis p:last-child{margin-bottom:0}

.num{font-variant-numeric:tabular-nums}
.today .pair{white-space:nowrap}
.today{margin:0;padding:8px 0;text-align:center;font-size:15px;border-bottom:1px solid var(--rule);line-height:1.6}

.extras{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:24px 56px;border-top:3px solid var(--rule);padding-top:20px}
.extra{min-width:0}
.cal{list-style:none;margin:0;padding:0}
.cal li{font-size:16px;line-height:1.6;padding:6px 0;border-bottom:1px solid var(--hair)}
.cal li:last-child{border-bottom:0}

.service{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,280px);gap:20px 48px;border-top:3px solid var(--rule);border-bottom:1px solid var(--rule);padding-block:20px}
@media (max-width:820px){.service{grid-template-columns:minmax(0,1fr)}}
.wx{min-width:0}
.scroll{overflow-x:auto}
.wx table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
.wx th,.wx td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--hair);white-space:nowrap;vertical-align:top}
.wx thead th{font-weight:600;font-size:14px;color:var(--muted);border-bottom:1px solid var(--rule)}
.wx tbody th{text-align:start;font-weight:600;padding-inline-start:0}
.wx .rain{display:block;font-size:12.5px;color:var(--muted)}
.side{display:flex;flex-direction:column;gap:18px;min-width:0}
.sub{margin:0 0 6px;font-family:var(--body);font-size:15px;font-weight:700}
.kv{list-style:none;margin:0;padding:0}
.kv li{display:flex;justify-content:space-between;gap:12px;font-size:15.5px;padding:4px 0;border-bottom:1px solid var(--hair)}
.kv li:last-child{border-bottom:0}
.chg{color:var(--muted);font-size:14px}
.hint{font-size:13px;color:var(--muted);margin:0 0 2px}
.svc-src{grid-column:1/-1;margin:0}

footer{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
footer p{font-size:16px}
footer .colophon{font-size:14px;color:var(--muted);max-width:68ch}
nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 26px;font-size:16px;padding-top:12px;border-top:1px solid var(--rule);width:100%}
nav span{color:var(--muted)}

.archive h2{margin:0 0 6px}
.archive ul{list-style:none;margin:0 0 28px;padding:0}
.archive li a{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;padding:14px 0;border-bottom:1px solid var(--hair);text-decoration:none;font-size:18px}
.archive li .meta{font-size:15px;color:var(--muted);align-self:center}
.note{font-size:15px;color:var(--muted)}

.prose h1{font-family:var(--display);font-size:clamp(30px,5vw,40px);margin:0 0 8px}
.prose h2{font-family:var(--display);font-size:22px;margin:28px 0 8px}
.prose p{margin:0 0 12px}
.prose ul{margin:0 0 12px;padding-inline-start:22px}
.prose li{font-size:17px;line-height:1.75;margin-bottom:6px}
</style>
</head>
<body>
{{CONTENT}}
</body>
</html>
