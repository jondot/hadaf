[service]
# The service box: weather, exchange rates, sun and Shabbat times. Fetched by scripts/fetch_data.py
# from public data sources (no AI involved) by the deploy workflow, right after the issue is pushed.
weather_days = 7
sun_city = "ירושלים"       # city for sunrise/sunset in the box
rates = ["USD", "EUR"]     # Bank of Israel representative rates vs the shekel
shabbat = true             # Shabbat times and weekly portion in Friday's issue

# geonameid is used for Shabbat times (hebcal.com); lat/lon for weather (open-meteo.com).
# shabbat = true on a city includes it in the Shabbat times.
[[service.cities]]
name = "ירושלים"
lat = 31.778
lon = 35.235
geonameid = 281184
shabbat = true

