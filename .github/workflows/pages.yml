name: Build and deploy

# On every push to main: fetch the service-box data (weather, rates, Shabbat times) for the newest
# issue if it has none yet, commit it, then build and publish the site. The data comes straight from
# public data sources, with no AI involved.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refetch_date:
        description: "Re-fetch service data for this issue date (YYYY-MM-DD). Empty = only if missing."
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch service data
        # A failed fetch never blocks publishing; the box is simply left out.
        continue-on-error: true
        run: |
          if [ -n "${{ inputs.refetch_date }}" ]; then
            python scripts/fetch_data.py --date "${{ inputs.refetch_date }}"
          else
            python scripts/fetch_data.py --latest-if-missing
          fi

      - name: Commit service data
        continue-on-error: true
        run: |
          git config user.name "hadaf-data"
          git config user.email "actions@users.noreply.github.com"
          git add issues/
          if git diff --cached --quiet; then echo "No new data."; exit 0; fi
          git commit -m "Service data for $(git diff --cached --name-only | head -1)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

      - run: python scripts/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
